name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        shell: pwsh
        run: |
          python -m py_compile ebay_tool.py core_rules.py shein_fetch.py
          python -m py_compile tools/merge_results.py tools/repair_images.py tools/repair_links.py
      - name: Smoke test
        run: |
          python -c "import core_rules, shein_fetch, ebay_tool; assert core_rules.calc_ebay_price(10, 2) == 20"
